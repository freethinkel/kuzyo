# Unattended Debian 13 install for kuzyo. Baked into the netboot initrd, see
# README. Wipes /dev/nvme0n1 without asking.

d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

# Ethernet only: the netboot initrd carries no Wi-Fi firmware.
d-i netcfg/choose_interface select auto
d-i netcfg/hostname string kuzyo
d-i netcfg/get_hostname string kuzyo
d-i netcfg/get_domain string

d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# Root logs in with a key over SSH; the password is for the local console.
d-i passwd/root-login boolean true
d-i passwd/make-user boolean false
d-i passwd/root-password-crypted password @ROOT_PASSWORD_HASH@

d-i clock-setup/utc boolean true
d-i time/zone string Asia/Nicosia
d-i clock-setup/ntp boolean true

# ESP, 64G ext4 root, the rest btrfs on /srv for Incus and app data. A full
# /srv cannot take the host down with it.
d-i partman-auto/disk string /dev/nvme0n1
d-i partman-auto/method string regular
d-i partman-partitioning/default_label string gpt
d-i partman-auto/expert_recipe string kuzyo :: \
    538 538 1075 free $iflabel{ gpt } $reusemethod{ } method{ efi } format{ } . \
    65536 65536 65536 ext4 method{ format } format{ } use_filesystem{ } filesystem{ ext4 } mountpoint{ / } . \
    1000 1000 -1 btrfs method{ format } format{ } use_filesystem{ } filesystem{ btrfs } mountpoint{ /srv } .
d-i partman-auto/choose_recipe select kuzyo
d-i partman-basicfilesystems/no_swap boolean false
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

d-i apt-setup/non-free-firmware boolean true
tasksel tasksel/first multiselect ssh-server
d-i pkgsel/include string python3 sudo
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

# Removable-media fallback path too, so a lost NVRAM entry still boots.
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default
d-i grub-installer/force-efi-extra-removable boolean true

d-i preseed/late_command string \
    mkdir -p -m 700 /target/root/.ssh; \
    echo 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJWbbZpmovOifbsXGkXBTq9sRRT2+fLfEuetKH57nJbI freethinkel' > /target/root/.ssh/authorized_keys; \
    chmod 600 /target/root/.ssh/authorized_keys

d-i finish-install/reboot_in_progress note
