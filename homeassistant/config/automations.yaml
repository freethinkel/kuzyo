- id: ac_off_when_everyone_left
  alias: Все ушли, кондиционеры выключаются
  triggers:
    - trigger: state
      entity_id: zone.home
      to: "0"
      for: "00:05:00"
  actions:
    - action: script.ac_set
      data:
        entities: [climate.living_room, climate.bedroom, climate.home_office]
        hvac_mode: "off"

- id: ac_cool_on_arrival
  alias: Пришли домой в жару, гостиная охлаждается
  triggers:
    - trigger: state
      entity_id: zone.home
      from: "0"
  conditions:
    - condition: numeric_state
      entity_id: weather.forecast_home
      attribute: temperature
      above: 28
  actions:
    - action: script.ac_set
      data:
        entities: climate.living_room
        hvac_mode: cool
        temperature: 25

- id: ac_off_at_night
  alias: Ночью кондиционеры в гостиной и кабинете выключаются
  triggers:
    - trigger: time
      at: "01:00:00"
  actions:
    - action: script.ac_set
      data:
        entities: [climate.living_room, climate.home_office]
        hvac_mode: "off"

- id: feeder_food_low
  alias: Кормушка, корм заканчивается
  triggers:
    - trigger: state
      entity_id: sensor.mmgg_sg_413818243_fi1_pet_food_left_level_p_2_6
      to: [Low, Empty]
  actions:
    - variables:
        message: >-
          {{ 'Корм закончился' if trigger.to_state.state == 'Empty' else 'Корм заканчивается' }}
    - action: notify.mobile_app_iphone_egor
      data:
        title: Кормушка
        message: "{{ message }}"
    - action: notify.mobile_app_iphone_valeriia
      data:
        title: Кормушка
        message: "{{ message }}"

- id: feeder_fault
  alias: Кормушка, ошибка
  triggers:
    - trigger: state
      entity_id: sensor.mmgg_sg_413818243_fi1_fault_p_2_1
      to: [Error, Timeout]
  actions:
    - action: notify.mobile_app_iphone_egor
      data:
        title: Кормушка
        message: "Ошибка: {{ trigger.to_state.state }}"

# Every morning until the desiccant is replaced and its counter reset.
- id: feeder_desiccant
  alias: Кормушка, пора менять влагопоглотитель
  triggers:
    - trigger: time
      at: "10:00:00"
  conditions:
    - condition: numeric_state
      entity_id: sensor.mmgg_sg_413818243_fi1_desiccant_left_time_p_11_2
      below: 1
  actions:
    - action: notify.mobile_app_iphone_egor
      data:
        title: Кормушка
        message: Пора заменить влагопоглотитель, потом нажмите «Сбросить влагопоглотитель»

- id: feeder_fed
  alias: Кормушка, корм выдан
  triggers:
    - trigger: state
      entity_id: event.mmgg_sg_413818243_fi1_feedsuccess_e_4_1
      not_from: [unavailable]
      not_to: [unavailable, unknown]
  actions:
    - action: notify.mobile_app_iphone_egor
      data:
        title: Кормушка
        message: Корм выдан

# The fuel adjustment changes every two months, see eac.price in
# configuration.yaml.
- id: electricity_tariff_reminder
  alias: Электричество, обновить тариф
  triggers:
    - trigger: time
      at: "10:00:00"
  conditions:
    - "{{ now().day == 1 and now().month % 2 == 1 }}"
  actions:
    - action: notify.mobile_app_iphone_egor
      data:
        title: Тариф EAC
        message: >-
          Новая топливная надбавка: eac.com.cy → Supply → Tariffs → Fuel Price
          Adjustment. Обнови eac.price в homeassistant/config/configuration.yaml

# On Tuesday, as EAC data lands a day late. Weeks start on Monday.
- id: electricity_weekly
  alias: Электричество, сводка за неделю
  triggers:
    - trigger: time
      at: "10:00:00"
  conditions:
    - condition: time
      weekday: tue
  actions:
    - action: recorder.get_statistics
      data:
        statistic_ids: ["eac:grid_consumption", "eac:grid_cost"]
        start_time: "{{ (today_at() - timedelta(days=now().weekday() + 14)).isoformat() }}"
        period: week
        types: [change]
      response_variable: stats
    - variables:
        kwh: "{{ stats.statistics['eac:grid_consumption'] | map(attribute='change') | list }}"
        eur: "{{ stats.statistics['eac:grid_cost'] | map(attribute='change') | list }}"
    - action: notify.mobile_app_iphone_egor
      data:
        title: Электричество за неделю
        message: >-
          {{ kwh[1] | round | int }} кВт·ч, €{{ '%.2f' | format(eur[1]) }}.
          Неделей раньше {{ kwh[0] | round | int }} кВт·ч, €{{ '%.2f' | format(eur[0]) }}

- id: electricity_over_budget
  alias: Электричество, за месяц больше €80
  triggers:
    - trigger: time
      at: "21:00:00"
      id: check
    - trigger: time
      at: "00:01:00"
      id: new_month
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: new_month
            - "{{ now().day == 1 }}"
          sequence:
            - action: input_boolean.turn_off
              target:
                entity_id: input_boolean.electricity_budget_alerted
        - conditions:
            - condition: trigger
              id: check
            - condition: state
              entity_id: input_boolean.electricity_budget_alerted
              state: "off"
          sequence:
            - action: recorder.get_statistics
              data:
                statistic_ids: ["eac:grid_cost"]
                start_time: "{{ today_at().replace(day=1).isoformat() }}"
                period: month
                types: [change]
              response_variable: stats
            - variables:
                eur: "{{ stats.statistics['eac:grid_cost'] | map(attribute='change') | sum }}"
            - condition: template
              value_template: "{{ eur > 80 }}"
            - action: input_boolean.turn_on
              target:
                entity_id: input_boolean.electricity_budget_alerted
            - action: notify.mobile_app_iphone_egor
              data:
                title: Электричество
                message: "С начала месяца уже €{{ '%.2f' | format(eur) }}, бюджет €80"

# Needs the Focus sensor enabled in the HA app on each iPhone. Whoever goes
# to sleep first sets the night mode.
- id: sleep_focus
  alias: Фокус «Сон», кондиционеры на ночь
  triggers:
    - trigger: state
      entity_id: [binary_sensor.iphone_egor_focus, binary_sensor.iphone_valeriia_focus]
      to: "on"
  conditions:
    - condition: time
      after: "22:00:00"
      before: "05:00:00"
  actions:
    - action: script.ac_set
      data:
        entities: [climate.living_room, climate.home_office]
        hvac_mode: "off"
    - action: script.ac_set
      data:
        entities: climate.bedroom
        hvac_mode: cool
        temperature: 26

- id: rain_tomorrow
  alias: Завтра дождь
  triggers:
    - trigger: time
      at: "20:00:00"
  actions:
    - action: weather.get_forecasts
      target:
        entity_id: weather.forecast_home
      data:
        type: daily
      response_variable: fc
    - variables:
        day: >-
          {% set tmr = (now() + timedelta(days=1)).date() | string %}
          {{ fc['weather.forecast_home'].forecast | selectattr('datetime', 'search', tmr) | first | default({}) }}
    - condition: template
      value_template: >-
        {{ (day.precipitation or 0) >= 1 or day.condition in
           ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail'] }}
    - action: notify.mobile_app_iphone_egor
      data: &rain
        title: Завтра дождь
        message: "{{ day.precipitation or 0 }} мм, уберите вещи с балкона"
    - action: notify.mobile_app_iphone_valeriia
      data: *rain

- id: internet_back
  alias: Интернет вернулся
  triggers:
    - trigger: state
      entity_id: binary_sensor.debian_router_wan_status
      from: "off"
      to: "on"
  conditions:
    - "{{ (now() - trigger.from_state.last_changed).total_seconds() > 60 }}"
  actions:
    - action: notify.mobile_app_iphone_egor
      data:
        title: Интернет вернулся
        message: >-
          Не было {{ ((now() - trigger.from_state.last_changed).total_seconds() / 60) | round | int }} мин,
          с {{ as_local(trigger.from_state.last_changed).strftime('%H:%M') }}

- id: rent_reminder
  alias: Оплатить квартиру
  triggers:
    - trigger: time
      at: "10:00:00"
  conditions:
    - "{{ now().day == 1 }}"
  actions:
    - action: notify.mobile_app_iphone_egor
      data: &rent
        title: Квартира
        message: Сегодня 1-е, пора заплатить за квартиру
    - action: notify.mobile_app_iphone_valeriia
      data: *rent
