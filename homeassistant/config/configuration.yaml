
# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# A thermostat per Pitsos air conditioner, on the Home Connect device. See
# custom_components/pitsos_ac; the token comes from hc_app_auth.py.
pitsos_ac:
  token: !secret hc_app_token

# Daily reading of the EAC smart meter from the DSO portal, see eac.py. It
# lands a day late, so the Energy dashboard books it on the day it arrives.
command_line:
  - sensor:
      name: Electricity meter
      unique_id: eac_meter
      command: python3 /config/eac.py
      command_timeout: 60
      scan_interval: 10800
      value_template: "{{ value_json.reading }}"
      json_attributes: [day, dt, meter]
      unit_of_measurement: kWh
      device_class: energy
      state_class: total_increasing

# Half-hour consumption and its cost as hourly statistics for the Energy
# dashboard, see custom_components/eac.
eac:
  email: !secret eac_email
  password: !secret eac_password
  # All-in €/kWh, tariff 01 from 1 May 2026: energy 17.89 + network 3.93 +
  # fuel adjustment 8.0151 (Sep/Oct 2026, low voltage) + RES fund 0.5 + PSO
  # 0.051 cent, plus 5% VAT. The fuel adjustment changes every two months:
  # eac.com.cy → Supply → Tariffs → Fuel Price Adjustment. Fixed charges
  # (supply €8, meter data €0.94 per two months) are left out.
  price: 0.319
