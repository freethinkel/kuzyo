---
# Debian 13 host on a ThinkPad T14 Gen 1. The host stays bare: services run
# in Incus guests, so a host upgrade has little to break.
- name: Host
  hosts: kuzyo
  remote_user: root
  gather_facts: true
  vars:
    lazyincus_version: 0.13.1
    lazydocker_version: 0.25.2
    # Secrets from .env (template: .env.sample), never from git.
    cloudflare_api_token: "{{ lookup('ansible.builtin.ini', 'CLOUDFLARE_API_TOKEN', file='.env', type='properties') }}"
    cloudflare_account_id: "{{ lookup('ansible.builtin.ini', 'CLOUDFLARE_ACCOUNT_ID', file='.env', type='properties') }}"
    cloudflare_tunnel_secret: "{{ lookup('ansible.builtin.ini', 'CLOUDFLARE_TUNNEL_SECRET', file='.env', type='properties') }}"
    immich_db_password: "{{ lookup('ansible.builtin.ini', 'IMMICH_DB_PASSWORD', file='.env', type='properties') }}"
    samba_password: "{{ lookup('ansible.builtin.ini', 'SAMBA_PASSWORD', file='.env', type='properties') }}"
    eac_email: "{{ lookup('ansible.builtin.ini', 'EAC_EMAIL', file='.env', type='properties') }}"
    eac_password: "{{ lookup('ansible.builtin.ini', 'EAC_PASSWORD', file='.env', type='properties') }}"
    ha_token: "{{ lookup('ansible.builtin.ini', 'HA_TOKEN', file='.env', type='properties') }}"
    restic_password: "{{ lookup('ansible.builtin.ini', 'RESTIC_PASSWORD', file='.env', type='properties') }}"
    adguard_password: "{{ lookup('ansible.builtin.ini', 'ADGUARD_PASSWORD', file='.env', type='properties') }}"
    # Compose stacks in apps/, run in the apps container. The port is
    # published on the host, so LAN and Tailscale reach it.
    stacks:
      - { name: immich, port: 2283 }
      - { name: glance, port: 8080 }

  tasks:
    - name: Upgrade packages
      ansible.builtin.apt:
        upgrade: dist
        update_cache: true
        cache_valid_time: 3600
      tags: upgrade

    # Remote access from anywhere without port forwarding. Logging in is a
    # one-off by hand: tailscale up --hostname=kuzyo
    - name: Add Tailscale repository
      ansible.builtin.get_url:
        url: "https://pkgs.tailscale.com/stable/debian/{{ ansible_distribution_release }}.noarmor.gpg"
        dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
        mode: "0644"

    - name: Tailscale apt source
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/tailscale.list
        content: |
          deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/debian {{ ansible_distribution_release }} main
        mode: "0644"

    - name: Install Tailscale
      ansible.builtin.apt:
        name: tailscale
        update_cache: true

    # Subnet router for the home LAN, so *.home.freethinkel.dev and
    # smb://kenos.home.freethinkel.dev work away from home over Tailscale and
    # directly at home. The route needs a one-off approval in the admin
    # console: Machines → kuzyo → Edit route settings.
    - name: IP forwarding for the subnet route
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: "1"
        sysctl_file: /etc/sysctl.d/99-tailscale.conf

    - name: Advertise the home LAN
      ansible.builtin.command: tailscale set --advertise-routes=192.168.1.0/24
      changed_when: false

    - name: Drop-in directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop: [/etc/systemd/logind.conf.d, /etc/systemd/system.conf.d, /etc/default/grub.d]

    # networkd drops a link's routes on carrier loss, so pulling the cable falls
    # back to Wi-Fi by itself. ClientIdentifier=mac keeps the router's
    # MAC-based leases. The Wi-Fi password lives in
    # /etc/wpa_supplicant/wpa_supplicant-wlp0s20f3.conf, set by hand.
    - name: Network on cable, Wi-Fi as fallback
      ansible.builtin.copy:
        dest: "/etc/systemd/network/{{ item.file }}"
        content: |
          [Match]
          Name={{ item.name }}

          [Network]
          DHCP=yes
          IgnoreCarrierLoss={{ item.carrier_loss }}

          [DHCPv4]
          ClientIdentifier=mac
          RouteMetric={{ item.metric }}
        mode: "0644"
      loop:
        - { file: 10-eth.network, name: enp0s31f6, metric: 100, carrier_loss: "no" }
        - { file: 20-wifi.network, name: wlp0s20f3, metric: 600, carrier_loss: 3s }
      notify: Reload networkd

    # iwlwifi power saving adds latency spikes and drops on an always-on box.
    - name: Keep Wi-Fi out of power save
      ansible.builtin.copy:
        dest: /etc/modprobe.d/iwlwifi-powersave.conf
        content: |
          options iwlmvm power_scheme=1
        mode: "0644"


    # The server lives on a shelf with the lid closed.
    - name: Ignore the lid switch
      ansible.builtin.copy:
        dest: /etc/systemd/logind.conf.d/lid.conf
        content: |
          [Login]
          HandleLidSwitch=ignore
          HandleLidSwitchExternalPower=ignore
          HandleLidSwitchDocked=ignore
        mode: "0644"
      notify: Restart logind

    # The iTCO hardware watchdog reboots the box if the kernel hangs while
    # nobody is around to press the power button.
    - name: Arm the hardware watchdog
      ansible.builtin.copy:
        dest: /etc/systemd/system.conf.d/watchdog.conf
        content: |
          [Manager]
          RuntimeWatchdogSec=30s
          RebootWatchdogSec=2min
        mode: "0644"
      notify: Reload systemd

    # The console login prompt would otherwise stay lit forever. Applies after
    # a reboot. Assumes GRUB, which is what preseed.cfg installs.
    - name: Blank the console after a minute
      ansible.builtin.copy:
        dest: /etc/default/grub.d/consoleblank.cfg
        content: |
          GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT consoleblank=60"
        mode: "0644"
      notify: Update grub

    # SanDisk Extreme 55DD drops off the bus when bound to uas (Synchronize
    # Cache failed, then USB disconnect). usb-storage handles it without UAS.
    - name: Keep the files disk off UAS
      ansible.builtin.copy:
        dest: /etc/default/grub.d/usb-quirk.cfg
        content: |
          GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT usb-storage.quirks=0781:55dd:u"
        mode: "0644"
      notify: Update grub

    # Always on AC, and sitting at 100% wears the cell out. ThinkPad firmware
    # honours the threshold itself, so it holds even while the OS is down.
    - name: Cap battery charge at 80%
      ansible.builtin.copy:
        dest: /etc/tmpfiles.d/battery.conf
        content: |
          w /sys/class/power_supply/BAT0/charge_control_end_threshold - - - - 80
        mode: "0644"
      notify: Apply tmpfiles

    # qemu and OVMF are for VMs; containers need only incus itself.
    - name: Install Incus
      ansible.builtin.apt:
        name: [incus, qemu-system-x86, ovmf]

    # Guests live on the btrfs /srv, so snapshots are instant and a guest
    # filling the disk cannot fill the host root.
    - name: Btrfs subvolume for the Incus pool
      ansible.builtin.command: btrfs subvolume create /srv/incus
      args:
        creates: /srv/incus

    # NAT bridge: the host is on Wi-Fi, and Wi-Fi cannot join a bridge.
    - name: Initialise Incus
      ansible.builtin.command: incus admin init --preseed
      args:
        stdin: |
          networks:
            - name: incusbr0
              type: bridge
              config:
                ipv4.address: auto
                ipv6.address: none
          storage_pools:
            - name: default
              driver: btrfs
              config:
                source: /srv/incus
          profiles:
            - name: default
              devices:
                root: {type: disk, path: /, pool: default}
                eth0: {type: nic, name: eth0, network: incusbr0}
        creates: /var/lib/incus/storage-pools/default

    # Edge: Caddy for *.home.freethinkel.dev, cloudflared for public names.
    - name: Edge directory
      ansible.builtin.file:
        path: /srv/edge
        state: directory
        mode: "0755"

    - name: Edge files
      ansible.builtin.copy:
        src: "edge/{{ item }}"
        dest: "/srv/edge/{{ item }}"
        mode: "0644"
      loop: [Dockerfile, compose.yml, Caddyfile, cloudflared.yml]
      notify: Reload edge

    - name: Cloudflare API token for Caddy
      ansible.builtin.copy:
        dest: /srv/edge/.env
        content: |
          CF_API_TOKEN={{ cloudflare_api_token }}
        mode: "0600"

    # cloudflared runs as uid 65532 inside its image.
    - name: Tunnel credentials
      ansible.builtin.copy:
        content: "{{ {'AccountTag': cloudflare_account_id, 'TunnelSecret': cloudflare_tunnel_secret,
          'TunnelID': (lookup('file', 'edge/cloudflared.yml') | from_yaml).tunnel} | to_json }}"
        dest: /srv/edge/credentials.json
        owner: "65532"
        mode: "0400"

    # AdGuard Home cannot take 0.0.0.0:53: dnsmasq of incusbr0 and resolved
    # hold port 53 on their own addresses. It binds the LAN and tailnet
    # addresses instead, and nonlocal bind lets it start before Wi-Fi or
    # Tailscale is up, and on whichever of cable and Wi-Fi is not.
    - name: Bind addresses not up yet
      ansible.posix.sysctl:
        name: net.ipv4.ip_nonlocal_bind
        value: "1"
        sysctl_file: /etc/sysctl.d/99-adguard.conf

    - name: AdGuard Home config directory
      ansible.builtin.file:
        path: /srv/edge/adguard/conf
        state: directory
        mode: "0700"

    # Seed only, written once: after that AdGuard Home owns the file and its
    # UI is the source of truth. Defaults fill in everything not set here.
    # The whole LAN is one /24, so the per-subnet rate limit is off.
    - name: AdGuard Home seed config
      ansible.builtin.copy:
        dest: /srv/edge/adguard/conf/AdGuardHome.yaml
        force: false
        content: |
          http:
            address: 127.0.0.1:3000
          users:
            - name: admin
              password: {{ adguard_password | password_hash('bcrypt') }}
          dns:
            bind_hosts: [192.168.1.243, 192.168.1.223, 100.72.74.39]
            port: 53
            ratelimit: 0
          schema_version: 34
        mode: "0600"
      no_log: true

    - name: Start edge
      ansible.builtin.command: docker compose up -d --build
      args:
        chdir: /srv/edge
      register: edge_up
      changed_when: "'Started' in edge_up.stderr or 'Recreated' in edge_up.stderr"

    # TUI for Incus, lazydocker-style. Run as root on the host: lazyincus
    - name: Download lazyincus {{ lazyincus_version }}
      ansible.builtin.get_url:
        url: "https://github.com/tallica/lazyincus/releases/download/v{{ lazyincus_version }}/lazyincus_{{ lazyincus_version }}_linux_amd64.tar.gz"
        checksum: "sha256:https://github.com/tallica/lazyincus/releases/download/v{{ lazyincus_version }}/checksums.txt"
        dest: "/var/cache/lazyincus_{{ lazyincus_version }}.tar.gz"
        mode: "0644"

    - name: Install lazyincus
      ansible.builtin.unarchive:
        src: "/var/cache/lazyincus_{{ lazyincus_version }}.tar.gz"
        dest: /usr/local/bin
        remote_src: true
        include: [lazyincus]
        owner: root
        group: root

    # TUI for Docker: lazydocker for HA and edge on the host,
    # lazydocker-apps for the stacks in the apps container.
    - name: Download lazydocker {{ lazydocker_version }}
      ansible.builtin.get_url:
        url: "https://github.com/jesseduffield/lazydocker/releases/download/v{{ lazydocker_version }}/lazydocker_{{ lazydocker_version }}_Linux_x86_64.tar.gz"
        checksum: "sha256:https://github.com/jesseduffield/lazydocker/releases/download/v{{ lazydocker_version }}/checksums.txt"
        dest: "/var/cache/lazydocker_{{ lazydocker_version }}.tar.gz"
        mode: "0644"

    - name: Install lazydocker
      ansible.builtin.unarchive:
        src: "/var/cache/lazydocker_{{ lazydocker_version }}.tar.gz"
        dest: /usr/local/bin
        remote_src: true
        include: [lazydocker]
        owner: root
        group: root

    - name: lazydocker-apps
      ansible.builtin.copy:
        dest: /usr/local/bin/lazydocker-apps
        content: |
          #!/bin/sh
          exec incus exec apps -- lazydocker "$@"
        mode: "0755"

    # App data sits outside the container, so apps can be rebuilt from
    # scratch without touching photos and databases.
    - name: Btrfs subvolume for app data
      ansible.builtin.command: btrfs subvolume create /srv/data
      args:
        creates: /srv/data

    # Nesting and the syscall intercepts are what Docker needs inside an
    # unprivileged container.
    - name: Launch containers
      ansible.builtin.command: >-
        incus launch images:debian/13 {{ item }}
        -c security.nesting=true
        -c security.syscalls.intercept.mknod=true
        -c security.syscalls.intercept.setxattr=true
      args:
        creates: "/var/lib/incus/storage-pools/default/containers/{{ item }}"
      loop: [apps, dev, fishruff-playground]
      tags: playground

    - name: Mount app data into apps
      ansible.builtin.command: incus config device add apps data disk source=/srv/data path=/data shift=true
      register: data_device
      changed_when: data_device.rc == 0
      failed_when: data_device.rc != 0 and 'already exists' not in data_device.stderr

    - name: Start guests with the host
      ansible.builtin.command: "incus config set {{ item }} boot.autostart=true"
      loop: [apps, dev, fishruff-playground]
      changed_when: false
      tags: playground

    # Compose stacks from apps/<name>/ land in /srv/stacks/<name> on the host
    # and show up in the apps container as /stacks/<name>.
    - name: Stacks directory
      ansible.builtin.file:
        path: /srv/stacks
        state: directory
        mode: "0755"

    - name: Mount stacks and the GPU into apps
      ansible.builtin.command: "incus config device add apps {{ item }}"
      loop:
        - stacks disk source=/srv/stacks path=/stacks shift=true
        - gpu gpu
        - files disk source=/srv/files path=/files shift=true
      register: apps_device
      changed_when: apps_device.rc == 0
      failed_when: apps_device.rc != 0 and 'already exists' not in apps_device.stderr

    - name: Publish stack ports on the host
      ansible.builtin.command: >-
        incus config device add apps port-{{ item.port }} proxy
        listen=tcp:0.0.0.0:{{ item.port }} connect=tcp:127.0.0.1:{{ item.port }}
      loop: "{{ stacks }}"
      register: port_device
      changed_when: port_device.rc == 0
      failed_when: port_device.rc != 0 and 'already exists' not in port_device.stderr

    - name: Install Docker in apps
      ansible.builtin.command: >-
        incus exec apps -- sh -c 'until getent hosts deb.debian.org >/dev/null; do sleep 1; done;
        apt-get update -q && DEBIAN_FRONTEND=noninteractive apt-get install -y -q docker.io docker-compose'
      args:
        creates: /var/lib/incus/storage-pools/default/containers/apps/rootfs/usr/bin/docker

    # ../ansible reaches dev over SSH, jumping through this host.
    - name: SSH server in dev
      ansible.builtin.command: >-
        incus exec dev -- sh -c 'until getent hosts deb.debian.org >/dev/null; do sleep 1; done;
        apt-get update -q && DEBIAN_FRONTEND=noninteractive apt-get install -y -q openssh-server python3 sudo &&
        install -d -m 700 /root/.ssh'
      args:
        creates: /var/lib/incus/storage-pools/default/containers/dev/rootfs/usr/sbin/sshd

    - name: Authorise the root key in dev
      ansible.builtin.command: incus file push /root/.ssh/authorized_keys dev/root/.ssh/authorized_keys --mode 0600
      args:
        creates: /var/lib/incus/storage-pools/default/containers/dev/rootfs/root/.ssh/authorized_keys

    # fishruff's box, moved off pocketserver. Their ~/.zshrc wants the zsh
    # plugins, fzf and starship from apt. The home directory itself was
    # copied over by hand once, keys included.
    - name: Packages and the fishruff user in fishruff-playground
      ansible.builtin.command: >-
        incus exec fishruff-playground -- sh -c 'until getent hosts deb.debian.org >/dev/null; do sleep 1; done;
        apt-get update -q && DEBIAN_FRONTEND=noninteractive apt-get install -y -q openssh-server sudo curl git
        zsh zsh-autosuggestions zsh-syntax-highlighting fzf starship nodejs npm build-essential &&
        useradd -m -s /usr/bin/zsh -G sudo fishruff &&
        echo "fishruff ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/fishruff'
      args:
        creates: /var/lib/incus/storage-pools/default/containers/fishruff-playground/rootfs/home/fishruff
      tags: playground

    - name: herdr and Claude Code for fishruff
      ansible.builtin.command: >-
        incus exec fishruff-playground -- su - fishruff -c
        'curl -fsSL https://herdr.dev/install.sh | sh && curl -fsSL https://claude.ai/install.sh | bash'
      args:
        creates: /var/lib/incus/storage-pools/default/containers/fishruff-playground/rootfs/home/fishruff/.local/bin/claude
      tags: playground

    # fishruff reaches it over their own tailnet. Logging in is a one-off by
    # hand: tailscale up --hostname=fishruff-playground, link to fishruff.
    - name: Tailscale in fishruff-playground
      ansible.builtin.command: incus exec fishruff-playground -- sh -c 'curl -fsSL https://tailscale.com/install.sh | sh'
      args:
        creates: /var/lib/incus/storage-pools/default/containers/fishruff-playground/rootfs/usr/bin/tailscale
      tags: playground

    # File share on the USB SSD (exFAT, label files, so a Mac can read it
    # too), served by Samba on the host. exFAT has no owners, so the mount
    # hands everything to freethinkel; nofail keeps boot going if it is
    # unplugged.
    - name: Samba user
      ansible.builtin.user:
        name: freethinkel
        uid: 1000
        shell: /usr/sbin/nologin
        create_home: false

    - name: Mount the files disk
      ansible.posix.mount:
        path: /srv/files
        src: LABEL=files
        fstype: exfat
        opts: nofail,x-systemd.device-timeout=10s,uid=1000,gid=1000,fmask=0000,dmask=0000
        state: mounted

    # The apps container bind-mounts /srv/files. Incus must not start before
    # the disk is mounted, or it binds the empty mountpoint on the NVMe. Only
    # Incus waits: Home Assistant and the edge must come up without the disk.
    - name: Incus waits for the files disk
      ansible.builtin.copy:
        dest: /etc/systemd/system/incus.service.d/files-disk.conf
        content: |
          [Unit]
          RequiresMountsFor=/srv/files
        mode: "0644"
      notify: Reload systemd

    # Same for Samba: without the disk it would serve the empty directory on
    # the NVMe, and clients would write there.
    - name: Samba waits for the files disk
      ansible.builtin.copy:
        dest: /etc/systemd/system/smbd.service.d/files-disk.conf
        content: |
          [Unit]
          RequiresMountsFor=/srv/files
        mode: "0644"
      notify: Reload systemd

    # Follows the disk in and out: stops apps and Samba and unmounts when it is
    # unplugged, mounts and restarts them when it comes back.
    - name: Files disk watcher
      ansible.builtin.copy:
        src: "files/{{ item.src }}"
        dest: "{{ item.dest }}"
        mode: "{{ item.mode }}"
      loop:
        - { src: kuzyo-files-watch, dest: /usr/local/sbin/kuzyo-files-watch, mode: "0755" }
        - { src: kuzyo-files-watch.service, dest: /etc/systemd/system/kuzyo-files-watch.service, mode: "0644" }
      notify: Reload systemd

    - name: Files disk watcher enabled
      ansible.builtin.systemd_service:
        name: kuzyo-files-watch.service
        enabled: true
        state: started
        daemon_reload: true

    # Only this folder is shared, the rest of the disk stays local.
    - name: Shared folder on the files disk
      ansible.builtin.file:
        path: /srv/files/shared-files
        state: directory

    - name: Install Samba
      ansible.builtin.apt:
        name: samba

    # Password in auth only, never in a share. No internet exposure: the
    # router forwards nothing, and Tailscale is a private network.
    - name: Samba config
      ansible.builtin.copy:
        dest: /etc/samba/smb.conf
        content: |
          [global]
             server role = standalone server
             server min protocol = SMB3
             map to guest = never
             disable netbios = yes
             smb ports = 445
             # Apple SMB extensions; the iOS Files app lists nothing without
             # them. exFAT has no xattrs, so streams go to a hidden .streams
             # directory instead of streams_xattr.
             vfs objects = fruit streams_depot
             fruit:metadata = stream
             fruit:model = MacSamba

          [Kenos]
             path = /srv/files/shared-files
             read only = no
             valid users = freethinkel
             # streams_depot moves stale stream dirs to the share root as
             # lost-<n>: exFAT inode numbers change between mounts.
             veto files = /lost-*/
             delete veto files = yes
        mode: "0644"
      notify: Reload Samba

    - name: Samba password
      ansible.builtin.shell: >-
        set -o pipefail;
        printf '%s\n%s\n' "$PW" "$PW" | smbpasswd -s -a freethinkel
      args:
        executable: /bin/bash
      environment:
        PW: "{{ samba_password }}"
      changed_when: false

    # smbd binds the addresses present when it starts, and it starts before
    # tailscale0 has one. Tailscale forwards 445 to localhost instead, so the
    # share works over the tailnet whatever the start order.
    - name: SMB over Tailscale
      ansible.builtin.command: tailscale serve --bg --tcp 445 tcp://localhost:445
      changed_when: false

    - name: Docker config directory
      ansible.builtin.file:
        path: /etc/docker
        state: directory
        mode: "0755"

    - name: Docker daemon config
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        content: |
          {"iptables": false, "ip6tables": false, "bridge": "none"}
        mode: "0644"

    # avahi answers kuzyo.local on the LAN.
    - name: Install Docker, BlueZ and avahi
      ansible.builtin.apt:
        name: [docker.io, docker-compose, bluez, avahi-daemon]

    - name: Btrfs subvolume for Home Assistant
      ansible.builtin.command: btrfs subvolume create /srv/homeassistant
      args:
        creates: /srv/homeassistant

    - name: Home Assistant compose file
      ansible.builtin.copy:
        src: homeassistant/compose.yml
        dest: /srv/homeassistant/compose.yml
        mode: "0644"

    # The rest of secrets.yaml is managed in the HA UI.
    - name: EAC portal login for the electricity meter sensor
      ansible.builtin.lineinfile:
        path: /srv/homeassistant/config/secrets.yaml
        regexp: "^{{ item.key }}:"
        line: "{{ item.key }}: {{ item.value | to_json }}"
      loop: "{{ {'eac_email': eac_email, 'eac_password': eac_password} | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      no_log: true

    - name: Start Home Assistant
      ansible.builtin.command: docker compose up -d
      args:
        chdir: /srv/homeassistant
      register: ha_up
      changed_when: "'Started' in ha_up.stderr or 'Recreated' in ha_up.stderr"

    - name: lazydocker in apps
      ansible.builtin.shell: |
        [ "$(md5sum < /usr/local/bin/lazydocker)" = "$(incus exec apps -- sh -c 'md5sum < /usr/local/bin/lazydocker' 2>/dev/null)" ] && exit
        incus file push --mode 0755 /usr/local/bin/lazydocker apps/usr/local/bin/lazydocker && echo pushed
      register: lazydocker_push
      changed_when: "'pushed' in lazydocker_push.stdout"

    - name: Stack files
      ansible.builtin.copy:
        src: "apps/{{ item.name }}/"
        dest: "/srv/stacks/{{ item.name }}/"
        mode: preserve
      loop: "{{ stacks }}"

    - name: Immich .env
      ansible.builtin.copy:
        dest: /srv/stacks/immich/.env
        content: |
          {{ lookup('file', 'apps/immich/env') }}
          DB_PASSWORD={{ immich_db_password }}
        mode: "0600"

    - name: Glance .env
      ansible.builtin.copy:
        dest: /srv/stacks/glance/.env
        content: |
          HA_TOKEN={{ ha_token }}
          CF_API_TOKEN={{ cloudflare_api_token }}
          CF_ACCOUNT_ID={{ cloudflare_account_id }}
          CF_TUNNEL_ID={{ (lookup('file', 'edge/cloudflared.yml') | from_yaml).tunnel }}
        mode: "0600"

    # Postgres rewrites pages in place; btrfs copy-on-write only fragments it.
    # +C must be set while the directory is still empty.
    # No mode: the Postgres container owns its directory and needs 0700.
    - name: Immich database directory
      ansible.builtin.file:  # noqa: risky-file-permissions
        path: /srv/data/immich/postgres
        state: directory

    - name: Immich storage on the files disk
      ansible.builtin.file:  # noqa: risky-file-permissions
        path: /srv/files/immich
        state: directory

    - name: No copy-on-write for the Immich database
      ansible.builtin.command: chattr +C /srv/data/immich/postgres
      changed_when: false

    - name: Start stacks
      ansible.builtin.command: "incus exec apps -- docker compose --project-directory /stacks/{{ item.name }} up -d"
      loop: "{{ stacks }}"
      register: stack_up
      changed_when: "'Started' in stack_up.stderr or 'Recreated' in stack_up.stderr"

    # Nightly restic backup of what this repo cannot rebuild: the Immich
    # database and Home Assistant's state. Photos are not in it. The repo sits
    # on the USB disk, so it outlives the NVMe, not the whole laptop.
    - name: Install restic
      ansible.builtin.apt:
        name: restic

    - name: Restic password
      ansible.builtin.copy:
        dest: /root/.restic-password
        content: "{{ restic_password }}"
        mode: "0600"
      no_log: true

    - name: Backup script
      ansible.builtin.copy:
        dest: /usr/local/sbin/kuzyo-backup
        mode: "0755"
        content: |
          #!/bin/bash
          set -euo pipefail
          export RESTIC_REPOSITORY=/srv/files/backup RESTIC_PASSWORD_FILE=/root/.restic-password
          incus exec apps -- docker exec immich_postgres pg_dumpall --clean --if-exists -U postgres |
            restic backup -q --tag immich --stdin --stdin-filename immich.sql
          # A read-only snapshot, so the recorder database is not caught mid-write.
          trap 'btrfs -q subvolume delete /srv/homeassistant-backup' EXIT
          btrfs -q subvolume snapshot -r /srv/homeassistant /srv/homeassistant-backup
          restic backup -q --tag homeassistant /srv/homeassistant-backup
          restic backup -q --tag adguard /srv/edge/adguard/conf
          restic forget -q --prune --keep-daily 7 --keep-weekly 4 --keep-monthly 6

    - name: Restic repository
      ansible.builtin.command: restic init -r /srv/files/backup -p /root/.restic-password
      args:
        creates: /srv/files/backup/config

    - name: Backup service and timer
      ansible.builtin.copy:
        dest: "/etc/systemd/system/kuzyo-backup.{{ item.key }}"
        content: "{{ item.value }}"
        mode: "0644"
      loop: "{{ units | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      vars:
        units:
          service: |
            [Unit]
            Description=Back up the Immich database and Home Assistant
            RequiresMountsFor=/srv/files

            [Service]
            Type=oneshot
            Environment=HOME=/root
            ExecStart=/usr/local/sbin/kuzyo-backup
          timer: |
            [Timer]
            OnCalendar=04:00
            Persistent=true

            [Install]
            WantedBy=timers.target

    - name: Start the backup timer
      ansible.builtin.systemd_service:
        name: kuzyo-backup.timer
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    # A restart, not caddy reload: copy replaces the file, and a single-file
    # bind mount keeps showing the old one.
    - name: Reload edge
      ansible.builtin.command: docker restart caddy cloudflared
      changed_when: true

    - name: Reload Samba
      ansible.builtin.command: smbcontrol smbd reload-config
      changed_when: true

    - name: Reload networkd
      ansible.builtin.command: networkctl reload
      changed_when: true

    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reexec: true

    - name: Restart logind
      ansible.builtin.systemd_service:
        name: systemd-logind
        state: restarted

    - name: Update grub
      ansible.builtin.command: update-grub
      changed_when: true

    - name: Apply tmpfiles
      ansible.builtin.command: systemd-tmpfiles --create /etc/tmpfiles.d/battery.conf
      changed_when: true
