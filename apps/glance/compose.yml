# Start page at home.freethinkel.dev, see config/glance.yml.
name: glance

services:
  glance:
    container_name: glance
    image: glanceapp/glance
    # HA_TOKEN and Cloudflare for the widgets, written by site.yml.
    env_file: .env
    labels:
      glance.hide: "true"
    volumes:
      - ./config:/app/config
      # Container list of this apps container; HA and edge run on the host.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # The pets Docker, for the dev page. A directory, since Incus makes a
      # new socket file whenever its proxy device restarts.
      - /srv/sockets:/sockets:ro
      - /files:/files:ro
    ports:
      - 8080:8080
    restart: unless-stopped
