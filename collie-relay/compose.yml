# Collie's shared relay (relay.freethinkel.dev): livekit-server and collie-relay on the host network, like Home
# Assistant, since WebRTC media needs UDP on the host's own address. HTTPS comes through the edge: cloudflared →
# Caddy on 127.0.0.1:8092 → collie-relay on 8091 and LiveKit's signaling on 7880 (edge/Caddyfile). The media ports,
# 7881/tcp and 7882/udp, are forwarded by the router. The collie-relay image is built from the Collie repo (README).
# Values come from .env (site.yml writes it); the relay's limits keep their defaults from the Collie repo's
# relay/deploy/compose.yaml unless set there.
services:
  livekit:
    image: livekit/livekit-server:v1.13.7
    container_name: collie-livekit
    network_mode: host
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "collie: ${LIVEKIT_API_SECRET}"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    restart: unless-stopped

  collie-relay:
    image: collie-relay:latest
    container_name: collie-relay
    network_mode: host
    environment:
      COLLIE_RELAY_DOMAIN: relay.freethinkel.dev
      COLLIE_RELAY_LISTEN: 127.0.0.1:8091
      COLLIE_RELAY_STATE: /state
      LIVEKIT_API_KEY: collie
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      LIVEKIT_API_URL: http://127.0.0.1:7880
      APNS_KEY_FILE: /secrets/apns.p8
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_TOPIC: dev.freethinkel.collie
    volumes:
      - ./state:/state
      - ./secrets:/secrets:ro
    restart: unless-stopped
