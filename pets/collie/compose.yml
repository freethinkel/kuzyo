# collie.freethinkel.dev, the landing page in site/ (the Collie repo's make deploy-site), and
# relay.freethinkel.dev, Collie's shared relay: livekit-server and collie-relay. Caddy takes both names from the
# tunnel on 127.0.0.1:8102. Everything is on the pets container's own network, since WebRTC media needs UDP on
# its own address: the host passes 7881/tcp and 7882/udp on to pets (site.yml), the router forwards them to the
# host. The collie-relay image is built from the Collie repo (README). Values come from .env (site.yml writes it);
# the relay's limits keep their defaults from the Collie repo's relay/deploy/compose.yaml unless set here.
name: collie

services:
  caddy:
    image: caddy:2-alpine
    container_name: collie-caddy
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv/site:ro
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:v1.13.7
    container_name: collie-livekit
    network_mode: host
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "collie: ${LIVEKIT_API_SECRET}"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    restart: unless-stopped

  collie-relay:
    image: collie-relay:latest
    container_name: collie-relay
    network_mode: host
    environment:
      COLLIE_RELAY_DOMAIN: relay.freethinkel.dev
      COLLIE_RELAY_LISTEN: 127.0.0.1:8091
      COLLIE_RELAY_STATE: /state
      LIVEKIT_API_KEY: collie
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      LIVEKIT_API_URL: http://127.0.0.1:7880
      APNS_KEY_FILE: /secrets/apns.p8
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_TOPIC: dev.freethinkel.collie
    volumes:
      - ./state:/state
      - ./secrets:/secrets:ro
    restart: unless-stopped
