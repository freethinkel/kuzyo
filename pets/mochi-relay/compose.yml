# mochi.freethinkel.dev: the landing page in site/ (the mochi repo's make deploy-site) and mochi's push relay
# (herdr hosts post agent lists, it sends APNs pushes). Caddy takes the name from the tunnel on 127.0.0.1:8104 and
# passes POST /push and /token to the relay on 127.0.0.1:8105, which stays inside pets. The binary is built and
# copied by the mochi repo (server/relay/README.md); secrets/apns.p8 is the APNs key, state/devices.json the
# app's tokens. The empty .env only tells site.yml the pet is ready to start.
name: mochi-relay

services:
  caddy:
    image: caddy:2-alpine
    container_name: mochi-caddy
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv/site:ro
    restart: unless-stopped

  relay:
    image: gcr.io/distroless/static-debian12
    container_name: mochi-relay
    network_mode: host
    command: ["/mochi-relay"]
    environment:
      MOCHI_RELAY_LISTEN: 127.0.0.1:8105
      MOCHI_RELAY_STATE: /state/devices.json
      APNS_KEY_FILE: /secrets/apns.p8
      APNS_KEY_ID: JT9M8A4P4P
      APNS_TEAM_ID: Z7PK4B5KU2
    volumes:
      - ./mochi-relay:/mochi-relay:ro
      - ./state:/state
      - ./secrets:/secrets:ro
    restart: unless-stopped
